[project]
name = "perfmodel"
version = "0.1.0"
description = "Analytical roofline + SRAM-aware performance and energy model for transformer LLM inference"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.optional-dependencies]
# Only needed on the GPU machine for bench/ (validation measurements).
bench = [
    "torch>=2.2",
    "transformers>=4.45",
    "accelerate>=0.30",
    "nvidia-ml-py>=12.535",  # provides the `pynvml` module
]

[project.scripts]
perfmodel = "perfmodel.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "matplotlib>=3.8",
    "nbformat>=5.9",
    "nbconvert>=7.16",
    "ipykernel>=6.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/perfmodel"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/perfmodel/cli.py" = ["B008"]  # typer.Option defaults are the Typer idiom
"notebooks/*.ipynb" = ["E501", "E402"]
