<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">perfmodel pipeline</title>
  <desc id="d">Specs flow into op counting, SRAM/DRAM placement, roofline and energy, then predictions. GPU benchmarks and predictions meet in the validation notebooks.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a8984"/>
    </marker>
    <style>
      .box { fill: #ffffff; stroke: #d6d4cf; stroke-width: 1.2; }
      .h { font-size: 14px; font-weight: 700; fill: #0b0b0b; }
      .f { font-size: 11px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; fill: #2a78d6; }
      .b { font-size: 11px; fill: #52514e; }
      .eq { font-size: 11px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; fill: #0b0b0b; }
      .lbl { font-size: 10.5px; fill: #52514e; font-style: italic; }
      .edge { stroke: #8a8984; stroke-width: 1.6; fill: none; }
    </style>
  </defs>

  <rect x="0" y="0" width="1000" height="330" rx="14" fill="#fcfcfb"/>

  <!-- Row 1: the model -->
  <g>
    <rect class="box" x="20" y="28" width="176" height="128" rx="10"/>
    <rect x="20" y="28" width="5" height="128" rx="2" fill="#2a78d6"/>
    <text class="h" x="36" y="52">Specs</text>
    <text class="f" x="36" y="70">configs/*.yaml</text>
    <text class="b" x="36" y="92">Model: layers, d, heads,</text>
    <text class="b" x="36" y="107">KV heads, d_ff, bits</text>
    <text class="b" x="36" y="127">Chip: peak TFLOP/s,</text>
    <text class="b" x="36" y="142">SRAM/DRAM BW, pJ</text>
  </g>
  <g>
    <rect class="box" x="216" y="28" width="176" height="128" rx="10"/>
    <rect x="216" y="28" width="5" height="128" rx="2" fill="#2a78d6"/>
    <text class="h" x="232" y="52">Count</text>
    <text class="f" x="232" y="70">ops.py</text>
    <text class="b" x="232" y="92">FLOPs + bytes per op:</text>
    <text class="b" x="232" y="107">QKV, attention (GQA,</text>
    <text class="b" x="232" y="122">causal, KV reads), MLP,</text>
    <text class="b" x="232" y="137">norms, LM head</text>
  </g>
  <g>
    <rect class="box" x="412" y="28" width="176" height="128" rx="10"/>
    <rect x="412" y="28" width="5" height="128" rx="2" fill="#2a78d6"/>
    <text class="h" x="428" y="52">Place</text>
    <text class="f" x="428" y="70">memory.py</text>
    <text class="b" x="428" y="92">Which weights / KV fit</text>
    <text class="b" x="428" y="107">in SRAM; the rest</text>
    <text class="b" x="428" y="122">streams from DRAM</text>
    <text class="b" x="428" y="142">policy: greedy | none | …</text>
  </g>
  <g>
    <rect class="box" x="608" y="28" width="176" height="128" rx="10"/>
    <rect x="608" y="28" width="5" height="128" rx="2" fill="#2a78d6"/>
    <text class="h" x="624" y="52">Time + energy</text>
    <text class="f" x="624" y="70">roofline.py</text>
    <text class="f" x="710" y="70">energy.py</text>
    <text class="eq" x="624" y="94">t = max(F/peak,</text>
    <text class="eq" x="676" y="109">B/BW)</text>
    <text class="eq" x="624" y="131">E = F·e_flop</text>
    <text class="eq" x="637" y="146">+ B·e_byte</text>
  </g>
  <g>
    <rect class="box" x="804" y="28" width="176" height="128" rx="10"/>
    <rect x="804" y="28" width="5" height="128" rx="2" fill="#2a78d6"/>
    <text class="h" x="820" y="52">Predict</text>
    <text class="f" x="820" y="70">predict.py, cli.py</text>
    <text class="b" x="820" y="92">per-op table, latency,</text>
    <text class="b" x="820" y="107">tok/s, mJ/token,</text>
    <text class="b" x="820" y="122">compute vs memory</text>
    <text class="b" x="820" y="137">bound; sweeps → CSV</text>
  </g>

  <path class="edge" d="M196,92 H214" marker-end="url(#arrow)"/>
  <path class="edge" d="M392,92 H410" marker-end="url(#arrow)"/>
  <path class="edge" d="M588,92 H606" marker-end="url(#arrow)"/>
  <path class="edge" d="M784,92 H802" marker-end="url(#arrow)"/>

  <!-- Row 2: validation -->
  <g>
    <rect class="box" x="412" y="210" width="330" height="92" rx="10"/>
    <rect x="412" y="210" width="5" height="92" rx="2" fill="#1baf7a"/>
    <text class="h" x="428" y="234">Measure (GPU)</text>
    <text class="f" x="428" y="252">bench/bench_decode.py</text>
    <text class="b" x="428" y="273">HF decode at fixed context, warmup,</text>
    <text class="b" x="428" y="288">CUDA events, NVML energy → CSV</text>
  </g>
  <g>
    <rect class="box" x="804" y="210" width="176" height="92" rx="10"/>
    <rect x="804" y="210" width="5" height="92" rx="2" fill="#1baf7a"/>
    <text class="h" x="820" y="234">Compare</text>
    <text class="f" x="820" y="252">notebooks/</text>
    <text class="b" x="820" y="273">validation, roofline,</text>
    <text class="b" x="820" y="288">design study</text>
  </g>

  <path class="edge" d="M892,156 V208" marker-end="url(#arrow)"/>
  <text class="lbl" x="900" y="187">predicted</text>
  <path class="edge" d="M742,256 H802" marker-end="url(#arrow)"/>
  <text class="lbl" x="772" y="249" text-anchor="middle">measured</text>

  <text class="lbl" x="20" y="232">Blue: the analytical model</text>
  <text class="lbl" x="20" y="250">(pure Python, no GPU needed).</text>
  <text class="lbl" x="20" y="276">Green: validation against</text>
  <text class="lbl" x="20" y="294">real hardware.</text>
</svg>
