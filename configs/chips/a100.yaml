# NVIDIA A100 SXM4 80GB
name: NVIDIA A100 SXM4 80GB
sources:
  - "NVIDIA A100 Tensor Core GPU datasheet (nvidia.com, A100 80GB SXM column)"
  - "NVIDIA A100 Tensor Core GPU Architecture whitepaper (40 MB L2)"
  - "Energy: Horowitz, 'Computing's Energy Problem', ISSCC 2014 (45 nm) -- see energy.py"
  - "HBM energy: O'Connor et al., 'Fine-Grained DRAM', MICRO 2017 (~3.9 pJ/bit for HBM2)"
peak_tflops:            # dense tensor-core peaks (datasheet values without sparsity)
  fp16: 312
  bf16: 312
  int8: 624             # TOPS
  fp32: 19.5            # CUDA-core (non-tensor) FP32: used for vector ops
dram_gbps: 2039         # HBM2e
dram_gib: 80
sram_mib: 40            # L2 cache
sram_persistent: false  # L2 is a hardware-managed cache, not a scratchpad
sram_gbps: null         # L2 bandwidth not published by NVIDIA; unused when not persistent
sram_pj_per_byte: null
energy_pj_per_flop:     # APPROXIMATE: Horowitz 45 nm; a 7 nm part is lower
  fp16: 0.75            # (1.1 pJ mul + 0.4 pJ add) / 2 FLOPs
  bf16: 0.75            # assumed equal to fp16
  int8: 0.115           # (0.2 + 0.03) / 2
  fp32: 2.3             # (3.7 + 0.9) / 2
dram_pj_per_byte: 31.2  # APPROXIMATE: 3.9 pJ/bit HBM2 x 8
static_power_w: 0.0     # not published; fit from measured idle power if needed
estimated: [energy_pj_per_flop, dram_pj_per_byte]
